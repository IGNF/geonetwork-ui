@if (externalViewer) {
  <gn-ui-button
    (buttonClick)="openInIgnExternalViewer()"
    type="primary"
    [title]="
      supportedLinkLayerType === 'wfs'
        ? 'Impossible d\'ouvrir ce type de service sur le visualiseur externe'
        : ('record.externalViewer.open' | translate)
    "
    [extraClass]="extraClass + 'bg-primary ms-2 !rounded-lg'"
    [disabled]="supportedLinkLayerType === 'wfs'"
  >
    <ng-icon name="matOpenInNew"></ng-icon>
  </gn-ui-button>
}
