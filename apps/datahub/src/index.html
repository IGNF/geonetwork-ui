<!doctype html>
<html lang="en" class="overflow-y-scroll">
  <head>
    <meta charset="utf-8" />
    <title>Rechercher une donnée | cartes.gouv.fr</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="preload"
      href="assets/configuration/default.toml"
      as="fetch"
      crossorigin
    />
    <script>
      window.dsfr = window.dsfr || {
        mode: 'angular',
      }
      window.dsfr.analytics = {
        domain: 'acwg.cartes.gouv.fr',
        collection: 'manual',
        page: {
          template: 'search',
        },
        site: {
          entity: 'IGN',
        },
      }
    </script>
    <script type="module" src="assets/dsfr/dsfr.module.min.js"></script>
    <script type="module" src="assets/dsfr/analytics.module.min.js"></script>
    <!-- Matomo -->
    <script type="text/javascript">
      var _paq = (window._paq = window._paq || [])
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(['enableLinkTracking'])
      ;(function () {
        var u = 'https://matomo.ign.fr/'
        _paq.push(['setTrackerUrl', u + 'matomo.php'])
        _paq.push(['setSiteId', '11'])
        var d = document,
          g = d.createElement('script'),
          s = d.getElementsByTagName('script')[0]
        g.async = true
        g.src = u + 'matomo.js'
        s.parentNode.insertBefore(g, s)
      })()
    </script>
    <!--

      <link rel="preload" href="assets/img/my_header.jpg" as="image" importance="high" />
    -->
    <!--%PRELOAD_LINKS%-->
