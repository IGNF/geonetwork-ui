server {
        listen       8080;
        listen  [::]:8080;
        server_name  localhost;

        server_tokens off;
        absolute_redirect off;

        location /catalogue/ {
          rewrite ^/catalogue/(.*)$ /rechercher-une-donnee/$1 redirect;
        }

        location = /rechercher-une-donnee {
          return 301 /rechercher-une-donnee/;
        }

        location /rechercher-une-donnee/ {
          root /opt;
          try_files $uri $uri/ /rechercher-une-donnee/index.html;
        }

        location / {
          root /opt/rechercher-une-donnee;
          try_files $uri $uri/ /rechercher-une-donnee/index.html;
        }
}